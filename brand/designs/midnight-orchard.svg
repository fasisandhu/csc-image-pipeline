<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1150" width="1000" height="1150">
  <!-- Sample design: invented brand "Midnight Orchard". Full-back graphic: moon, tree, stars, wordmark. -->
  <defs><mask id="crescent"><rect width="1000" height="1150" fill="white"/><circle cx="560" cy="210" r="130" fill="black"/></mask></defs>
  <circle cx="500" cy="250" r="150" fill="#EDE6D6" mask="url(#crescent)"/>
  <g fill="#C8B39A">
    <circle cx="190" cy="140" r="9"/><circle cx="820" cy="120" r="7"/><circle cx="880" cy="330" r="10"/><circle cx="120" cy="380" r="6"/>
    <rect x="470" y="560" width="60" height="230" rx="12"/>
    <circle cx="500" cy="520" r="150"/><circle cx="380" cy="590" r="110"/><circle cx="620" cy="590" r="110"/>
  </g>
  <rect x="150" y="790" width="700" height="14" rx="7" fill="#EDE6D6"/>
  <text x="500" y="935" font-family="Georgia" font-weight="bold" font-size="118" fill="#EDE6D6" text-anchor="middle" letter-spacing="14">MIDNIGHT</text>
  <text x="500" y="1075" font-family="Georgia" font-weight="bold" font-size="118" fill="#EDE6D6" text-anchor="middle" letter-spacing="14">ORCHARD</text>
